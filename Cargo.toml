[workspace]
members = ["crates/legacy", "crates/core", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.2.9"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
csv = "1.3"
# dates: Excel date cells come out as dates, not serial numbers.
calamine = { version = "0.26", features = ["dates"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2.5"
toml = "0.8"
tempfile = "3.0"
log = "0.4"
encoding_rs = "0.8"
unicode-normalization = "0.1"
# Paths without Windows' \\?\ prefix (Workbench and the YAML configs get these).
dunce = "1.0"
clap = { version = "4.5", default-features = false, features = [
	"std",
	"derive",
	"help",
	"usage",
	"error-context",
] }
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"
organise-legacy = { path = "crates/legacy" }
sacda-core = { path = "crates/core" }
sacda-tui = { path = "crates/tui" }

# The `organise` binary: CLI parsing and the plain (non-TUI) mode. The work is in
#   crates/core    sacda-core: sheet -> checks -> bundle -> Workbench (no UI)
#   crates/tui     sacda-tui: the interactive screen, on top of sacda-core
#   crates/legacy  organise-legacy: the old modifier pipeline (`organise legacy`)
[package]
name = "workbench-preprocessor"
version.workspace = true
edition.workspace = true

[lib]
name = "organise"
path = "src/lib.rs"

[[bin]]
name = "organise"
path = "src/main.rs"

[dependencies]
organise-legacy.workspace = true
sacda-core.workspace = true
sacda-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
env_logger = "0.11"

[dev-dependencies]
tempfile.workspace = true
csv.workspace = true
url.workspace = true

# Test builds keep only line tables (enough for backtraces): full debug info
# made target/debug several GB.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Better optimization (slower compile, smaller binary)
strip = true      # Automatically strip symbols
# No panic = "abort": a panic on the check thread must unwind so the screen
# can say the check stopped instead of the whole program dying.
